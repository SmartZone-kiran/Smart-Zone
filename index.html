<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Zone Online Service — Agriculture ID Card Generator">
<title>Smart Zone | Online Service</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",Arial,sans-serif;
  background:#f4f8fc;color:#12233b;
}
.header{
  background:#fff;border-bottom:1px solid #e5edf5;
  position:sticky;top:0;z-index:10;
}
.header-inner{
  width:min(1100px,92%);margin:auto;min-height:72px;
  display:flex;align-items:center;justify-content:center;
}
.logo{
  font-size:26px;font-weight:850;color:#0b63ce;letter-spacing:.2px;
}
.hero{
  min-height:calc(100vh - 72px);
  display:flex;align-items:center;justify-content:center;
  padding:55px 18px;
  background:
    radial-gradient(circle at 15% 15%,rgba(18,145,255,.12),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(255,166,0,.10),transparent 28%),
    #f7fbff;
}
.hero-inner{width:min(850px,100%);text-align:center}
.welcome{
  font-size:clamp(38px,8vw,70px);line-height:1.05;
  margin:0 0 12px;font-weight:900;letter-spacing:-1.5px;
}
.welcome span{color:#0b63ce}
.subtitle{
  margin:0 auto 34px;color:#64748b;font-size:clamp(17px,3vw,22px);
}
.generator-card{
  width:min(520px,100%);margin:auto;padding:34px 25px;
  background:#fff;border:1px solid #e2ebf4;border-radius:28px;
  box-shadow:0 20px 55px rgba(22,65,105,.13);
  cursor:pointer;transition:.22s;
}
.generator-card:hover{transform:translateY(-5px);box-shadow:0 25px 65px rgba(22,65,105,.18)}
.card-icon{
  width:82px;height:82px;border-radius:22px;margin:0 auto 18px;
  display:grid;place-items:center;font-size:42px;
  background:linear-gradient(135deg,#0b63ce,#1ba5ff);color:white;
}
.generator-card h2{margin:0 0 8px;font-size:27px}
.generator-card p{margin:0;color:#64748b}
.tap{
  display:inline-block;margin-top:22px;padding:12px 20px;border-radius:12px;
  background:#0b63ce;color:#fff;font-weight:800;
}
.generator-view{
  display:none;min-height:100vh;background:#0c1b2c;padding:18px 0 35px;
}
.generator-top{
  width:min(1180px,96%);margin:auto;display:flex;align-items:center;
  justify-content:space-between;gap:12px;margin-bottom:14px;
}
.back{
  border:0;background:#fff;color:#0b63ce;padding:11px 16px;
  border-radius:11px;font-weight:800;cursor:pointer;
}
.generator-title{color:#fff;font-weight:800;font-size:18px}
.app-shell{
  width:min(1180px,96%);margin:auto;background:#fff;border-radius:20px;
  padding:8px;box-shadow:0 18px 55px rgba(0,0,0,.25);
}
iframe{
  width:100%;height:calc(100vh - 105px);min-height:680px;
  border:0;border-radius:15px;background:#fff;
}
.note{
  width:min(1180px,96%);margin:12px auto 0;color:#b9c9da;
  text-align:center;font-size:13px;
}
footer{padding:24px;text-align:center;color:#7a8a9b;background:#fff}
.hidden{display:none!important}
@media(max-width:600px){
  .header-inner{min-height:62px}
  .logo{font-size:22px}
  .hero{min-height:calc(100vh - 62px);padding:35px 14px}
  .generator-card{padding:28px 20px}
  .generator-view{padding:10px 0 22px}
  .generator-top{width:94%;margin-bottom:9px}
  .generator-title{font-size:15px}
  .app-shell{width:94%;padding:5px;border-radius:14px}
  iframe{height:calc(100vh - 92px);min-height:620px;border-radius:10px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">Smart Zone</div>
  </div>
</header>

<main id="home" class="hero">
  <div class="hero-inner">
    <h1 class="welcome">Welcome to <span>Smart Zone</span></h1>
    <p class="subtitle">Online Service</p>

    <div class="generator-card" onclick="openGenerator()" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter'||event.key===' ')openGenerator()">
      <div class="card-icon">🪪</div>
      <h2>Agriculture ID Card Generator</h2>
      <p>কার্ড তৈরি করতে এখানে ট্যাপ করুন</p>
      <div class="tap">Generate ID Card →</div>
    </div>
  </div>
</main>

<section id="generator" class="generator-view">
  <div class="generator-top">
    <button class="back" onclick="closeGenerator()">← Back</button>
    <div class="generator-title">Agriculture ID Card Generator</div>
  </div>

  <div class="app-shell">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxQCgGEwL14773SLyPfDnm9L7dWdQ8ELYmZOH4Bz1qu-wYRQvQVtMVPWh16ItDUoIjz3Q/exec"
      title="Agriculture ID Card Generator"
      allow="clipboard-read; clipboard-write"
      loading="eager">
    </iframe>
  </div>

  <div class="note">Smart Zone • Agriculture ID Card Generator</div>
</section>

<footer id="footer">Smart Zone · Online Service</footer>

<script>
function openGenerator(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('footer').classList.add('hidden');
  document.getElementById('generator').style.display='block';
  window.scrollTo({top:0,behavior:'instant'});
  history.pushState({generator:true},'', '#agriculture-id-card');
}
function closeGenerator(){
  document.getElementById('generator').style.display='none';
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'instant'});
  history.pushState({},'', location.pathname);
}
window.addEventListener('popstate',function(){
  document.getElementById('generator').style.display='none';
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
});
</script>
</body>
</html>
